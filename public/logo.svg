<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Angel Nails</title>
  <desc id="desc">Logo de Angel Nails en rosa blush con lettering negro y detalle botanico.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF0F0"/>
      <stop offset="1" stop-color="#F8DCDD"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8A09A" stop-opacity=".92"/>
      <stop offset=".5" stop-color="#D9827F" stop-opacity=".78"/>
      <stop offset="1" stop-color="#C66D78" stop-opacity=".62"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2"/>
    </filter>
  </defs>

  <rect width="120" height="120" fill="url(#paper)"/>
  <rect x="22" y="25" width="76" height="70" fill="none" stroke="#D99594" stroke-opacity=".5" stroke-width=".8"/>
  <rect x="29" y="18" width="63" height="72" fill="none" stroke="#C98582" stroke-opacity=".42" stroke-width=".7"/>

  <g filter="url(#soft)" opacity=".95">
    <path d="M8 43 C20 27 39 32 55 28 C71 24 98 29 112 43 C101 48 94 57 75 55 C55 53 38 67 18 59 C10 56 6 50 8 43Z" fill="url(#wash)"/>
    <path d="M13 55 C29 45 42 48 55 43 C73 37 91 42 108 53 C94 58 88 68 67 65 C47 62 31 72 16 66 C10 64 9 59 13 55Z" fill="#D9827F" opacity=".42"/>
    <path d="M25 31 C42 26 59 30 73 27 C85 25 98 29 104 36 C91 39 81 44 64 40 C48 37 36 43 23 40Z" fill="#F0B2A7" opacity=".58"/>
  </g>

  <path d="M75 43 C83 34 93 30 101 27" fill="none" stroke="#202020" stroke-width=".75" stroke-linecap="round"/>
  <path d="M83 37 C82 31 86 28 90 29 C89 34 86 37 83 37Z" fill="#242424"/>
  <path d="M91 32 C92 26 98 25 101 27 C99 31 95 33 91 32Z" fill="#242424"/>
  <path d="M78 42 C74 37 76 33 80 32 C82 37 81 40 78 42Z" fill="#242424"/>

  <text x="60" y="61" text-anchor="middle" fill="#151515" font-family="'Brush Script MT', 'Segoe Script', cursive" font-size="23" font-style="italic" letter-spacing="-1.2">Angel</text>
  <line x1="31" y1="68" x2="89" y2="68" stroke="#171717" stroke-width=".7" opacity=".7"/>
  <rect x="44" y="72" width="32" height="14" fill="#171717"/>
  <text x="60" y="81.5" text-anchor="middle" fill="#FFF4F2" font-family="Arial, sans-serif" font-size="6.3" font-weight="700" letter-spacing="1.1">NAILS</text>
</svg>
