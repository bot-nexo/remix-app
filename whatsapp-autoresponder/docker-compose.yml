services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in whatsapp-autoresponder/.env}
      POSTGRES_DB: evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:8480:8080"
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?Define EVOLUTION_API_KEY in whatsapp-autoresponder/.env}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_SAVE_DATA_INSTANCE: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  whatsapp-bot:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    env_file: .env
    environment:
      CONFIG_PATH: /app/data/config.json
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Define ADMIN_API_KEY in whatsapp-autoresponder/.env}
      EVOLUTION_API_URL: http://evolution:8080
      EVOLUTION_WEBHOOK_URL: http://whatsapp-bot:3000/webhook/evolution
      EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET:?Define EVOLUTION_WEBHOOK_SECRET in whatsapp-autoresponder/.env}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Define SUPABASE_SERVICE_ROLE_KEY in whatsapp-autoresponder/.env}
      BOOKING_LINK_SECRET: ${BOOKING_LINK_SECRET:?Define BOOKING_LINK_SECRET in whatsapp-autoresponder/.env}
      WHATSAPP_ADMIN_USER_ID: ${WHATSAPP_ADMIN_USER_ID:?Define WHATSAPP_ADMIN_USER_ID in whatsapp-autoresponder/.env}
    volumes:
      - bot_config:/app/data
    depends_on:
      - evolution

volumes:
  postgres_data:
  redis_data:
  bot_config:
