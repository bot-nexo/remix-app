services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  evolution:
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    ports:
      - "8480:8080"
    environment:
      - AUTHENTICATION_API_KEY=evo_clave_secreta_123
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgres://postgres:postgres@postgres:5432/evolution?schema=public
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379
    depends_on:
      - postgres
      - redis

  whatsapp-bot:
    build: .
    restart: unless-stopped
    ports:
      - "3100:3000"
    env_file: .env
    volumes:
      - ./config.json:/app/config.json
    depends_on:
      - evolution

volumes:
  postgres_data:
  redis_data:
